      - name: is_available
        description: "版本生效月初不晚于 organization_as_of 时为真。"
        tests: [not_null]
      - name: is_current
        description: "按 organization_as_of 选中的最近已生效版本；该版所有树关系为真。"
        tests: [not_null]
      - name: ancestor_position_name
        description: "该版本祖先岗位的展示名称。"
        tests: [not_null]
      - name: descendant_position_name
        description: "该版本后代岗位的展示名称。"
        tests: [not_null]
      - name: descendant_parent_code
        description: "后代岗位在该版本的直接上级岗位，根岗位为空。"
