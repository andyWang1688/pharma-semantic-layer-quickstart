        tests: [not_null]
      - name: descendant_position_code
        description: "同版本的后代岗位；自身也作为后代。"
        tests: [not_null]
      - name: depth
        description: "祖先到后代的层级距离；自身为 0。"
        tests: [not_null]
      - name: valid_from
